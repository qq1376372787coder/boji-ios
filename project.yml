name: Boji
options:
  bundleIdPrefix: cloud.gongxiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Boji:
    type: application
    platform: iOS
    sources:
      - path: Boji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.gongxiang.boji
        PRODUCT_NAME: 薄肌俱乐部
        INFOPLIST_KEY_CFBundleDisplayName: 薄肌俱乐部
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSCameraUsageDescription: 用于拍摄训练计划、食物和手表截图，以便识别并录入记录。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选择训练计划、食物和手表截图，以便识别并录入记录。
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets: []
